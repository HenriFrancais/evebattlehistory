# App/fleet config (committed; safe defaults). Secrets live in .env, never here.

# Who may CREATE a battle report. A user qualifies if their rank is listed here
# OR any of their teams is in create_teams (both case-insensitive).
create_ranks = ["CEO", "Director", "High Command"]
create_teams = ["fc"]

# The "us" entity set — used to label each fight side friendly/hostile and to
# compute BR-level win/loss and "we killed / we fielded" queries. Fill with the
# real NV alliance/corp IDs before deploying.
our_alliance_ids = []
our_corp_ids = []

# Discord: creating a BR opens a thread in the FC/HC forum channel (its link is
# shown in-app to FC/HC only) and posts an announcement to the member channel.
# The bot token is a secret in .env (DISCORD_BOT_TOKEN); leave IDs empty to
# disable. public_base_url is the externally reachable app base (NV Tools
# namespace + prefix) used to build the BR links posted to Discord.
discord_forum_channel_id = ""
discord_member_channel_id = ""
public_base_url = ""
